site_name: COMPAS Framework
site_url: https://compas.dev/compas_framework/
repo_name: compas-dev/compas_framework
repo_url: https://github.com/compas-dev/compas_framework/
copyright: Copyright &copy; COMPAS Association

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            modernize_annotations: true
            separate_signature: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Contributing: contributing.md
  - Framework:
      - Package Matrix: packages.md
      - Testing Strategy: testing.md
  - Examples: examples.md
  - API Reference: api.md
  - Project:
      - License: license.md
