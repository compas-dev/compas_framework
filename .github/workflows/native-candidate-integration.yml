name: native-candidate-integration

on:
  push:
    branches:
      - initiative/candidate-artifact-integration
  workflow_call:
    inputs:
      manifest_path:
        description: Reviewed candidate manifest in this repository
        required: false
        default: .github/candidates/native-linux-py312.json
        type: string
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Reviewed candidate manifest in this repository
        required: false
        default: .github/candidates/native-linux-py312.json
        type: string

permissions:
  contents: read

concurrency:
  group: native-candidate-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrieve:
    if: github.repository == 'compas-dev/compas_framework' && github.ref_protected
    runs-on: ubuntu-24.04
    environment: candidate-artifact-retrieval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.7"
      - run: uv sync --frozen --only-group candidate --no-install-project
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CANDIDATE_ARTIFACT_APP_ID }}
          private-key: ${{ secrets.CANDIDATE_ARTIFACT_PRIVATE_KEY }}
          owner: compas-dev
          repositories: |
            compas
            compas_occ
            compas_cgal
            compas_libigl
      - name: Retrieve and verify admitted candidate artifacts
        env:
          CANDIDATE_ARTIFACT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          uv run --no-sync python .github/scripts/candidate_artifacts.py retrieve
          "${{ inputs.manifest_path || '.github/candidates/native-linux-py312.json' }}"
          "${RUNNER_TEMP}/verified-native-candidates"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-native-candidates
          path: ${{ runner.temp }}/verified-native-candidates
          if-no-files-found: error
          retention-days: 1

  build-framework-wheel:
    if: github.repository == 'compas-dev/compas_framework' && github.ref_protected
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.7"
      - run: uv sync --frozen --only-group build --no-install-project
      - name: Build and verify framework wheel once
        run: |
          mkdir -p "${RUNNER_TEMP}/source" "${RUNNER_TEMP}/framework-integration/framework" "${RUNNER_TEMP}/framework-integration/harness"
          git archive --format=tar HEAD | tar -xf - -C "${RUNNER_TEMP}/source"
          uv build --wheel "${RUNNER_TEMP}/source" --out-dir "${RUNNER_TEMP}/framework-integration/framework"
          uv run --no-sync twine check "${RUNNER_TEMP}"/framework-integration/framework/*.whl
          cd "${RUNNER_TEMP}/framework-integration/framework"
          sha256sum -- ./*.whl > SHA256SUMS
      - name: Assemble credential-free integration harness
        run: |
          cp .github/scripts/candidate_artifacts.py "${RUNNER_TEMP}/framework-integration/harness/"
          cp .github/candidates/candidate_integration.py "${RUNNER_TEMP}/framework-integration/harness/"
          cp .github/candidates/candidate_typing_consumer.py "${RUNNER_TEMP}/framework-integration/harness/"
          cp .github/candidates/environment-native-linux-py312.yml "${RUNNER_TEMP}/framework-integration/harness/"
          cp .github/candidates/runtime-linux-py312.txt "${RUNNER_TEMP}/framework-integration/harness/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: framework-integration-harness
          path: ${{ runner.temp }}/framework-integration
          if-no-files-found: error
          retention-days: 1

  execute:
    needs: [retrieve, build-framework-wheel]
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-native-candidates
          path: ${{ runner.temp }}/verified-native-candidates
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: framework-integration-harness
          path: ${{ runner.temp }}/framework-integration
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: compas-candidate
          python-version: "3.12"
          channels: conda-forge
      - name: Install the pinned third-party runtime
        shell: bash -el {0}
        run: |
          conda env update --name compas-candidate --file "${RUNNER_TEMP}/framework-integration/harness/environment-native-linux-py312.yml"
          python -m pip install --no-deps --requirement "${RUNNER_TEMP}/framework-integration/harness/runtime-linux-py312.txt"
          conda list --explicit
          python -m pip freeze --all
      - name: Revalidate and install exact candidate wheels offline
        shell: bash -el {0}
        env:
          PIP_NO_INDEX: "1"
          PYTHONPATH: ""
        run: >-
          python "${RUNNER_TEMP}/framework-integration/harness/candidate_artifacts.py" install
          "${RUNNER_TEMP}/verified-native-candidates"
          "${RUNNER_TEMP}/framework-integration"
          --python "$(command -v python)"
      - name: Run installed runtime and typing contracts outside all checkouts
        shell: bash -el {0}
        env:
          PIP_NO_INDEX: "1"
          PYTHONPATH: ""
        run: |
          mkdir -p "${RUNNER_TEMP}/candidate-execution"
          cp "${RUNNER_TEMP}/framework-integration/harness/candidate_integration.py" "${RUNNER_TEMP}/candidate-execution/"
          cp "${RUNNER_TEMP}/framework-integration/harness/candidate_typing_consumer.py" "${RUNNER_TEMP}/candidate-execution/"
          cd "${RUNNER_TEMP}/candidate-execution"
          python -m pytest candidate_integration.py --junitxml candidate-junit.xml
          python -m pyright --pythonpath "$(command -v python)" candidate_typing_consumer.py
          python "${RUNNER_TEMP}/framework-integration/harness/candidate_artifacts.py" verify-junit candidate-junit.xml \
            --required test_exact_candidate_distributions_are_installed \
            --required test_installed_entry_points_discover_lightweight_plugins \
            --required test_cgal_result_passes_directly_to_core_and_libigl \
            --required test_occ_backend_constructs_core_brep

