name: docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Configure temporary tool environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/framework-docs" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.7"
      - run: uv sync --locked --project .github/tooling
      - run: uv run --no-sync --project .github/tooling mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

  deploy:
    if: github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions.docs@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
