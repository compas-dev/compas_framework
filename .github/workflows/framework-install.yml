name: framework-install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: targets
        run: |
          matrix=$(jq -ce '{os: .install_check_os, python: .python}' framework-matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.7"
      - name: Build the metapackage wheel
        run: |
          mkdir -p "$RUNNER_TEMP/framework-source"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/framework-source"
          uv build --wheel --no-sources "$RUNNER_TEMP/framework-source" --out-dir "$RUNNER_TEMP/framework-dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: framework-install-wheel
          path: ${{ runner.temp }}/framework-dist/*.whl
          if-no-files-found: error

  install:
    needs: targets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: framework-install-wheel
          path: ${{ runner.temp }}/framework-dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.7"
      - name: Resolve and install the complete framework from PyPI
        working-directory: ${{ runner.temp }}
        run: |
          uv venv framework-smoke --python "$(command -v python)"
          smoke_python=framework-smoke/bin/python
          if [[ "$RUNNER_OS" == Windows ]]; then
            smoke_python=framework-smoke/Scripts/python.exe
          fi
          uv pip install --no-config --python "$smoke_python" --default-index https://pypi.org/simple framework-dist/*.whl
          uv pip check --python "$smoke_python"
          "$smoke_python" -I -c "import compas_framework; assert compas_framework.__version__"
