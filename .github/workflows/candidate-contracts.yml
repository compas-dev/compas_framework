name: candidate-contracts

on:
  pull_request:
    branches:
      - main
      - c3-upgrade
      - initiative/geometry-tessellation
      - initiative/repository-modernisation
      - initiative/candidate-artifact-integration
  push:
    branches:
      - initiative/candidate-artifact-integration

permissions:
  contents: read

concurrency:
  group: candidate-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    env:
      UV_CACHE_DIR: /tmp/candidate-contract-uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/candidate-contract-venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.7"
      - run: uv sync --frozen --only-group candidate --no-install-project
      - name: Lint candidate verifier and fixtures
        run: |
          uv run --no-sync ruff check .github/scripts/candidate_artifacts.py .github/candidates .github/tests/test_candidate_artifacts.py
          uv run --no-sync ruff format --check .github/scripts/candidate_artifacts.py .github/candidates .github/tests/test_candidate_artifacts.py
          uv run --no-sync pyright .github/scripts/candidate_artifacts.py
      - name: Run schema, provenance, security, and release-order contracts
        run: >-
          uv run --no-sync pytest
          --basetemp "${RUNNER_TEMP}/candidate-pytest"
          -o cache_dir="${RUNNER_TEMP}/candidate-pytest-cache"
          .github/tests/test_candidate_artifacts.py
      - name: Prove a changed wheel digest is rejected
        run: >-
          uv run --no-sync pytest -q
          .github/tests/test_candidate_artifacts.py::test_offline_bundle_revalidates_exact_inventory_and_hashes
      - name: Prove a skipped required backend is rejected
        run: >-
          uv run --no-sync pytest -q
          '.github/tests/test_candidate_artifacts.py::test_junit_rejects_nonpassing_or_missing_evidence[skip]'

