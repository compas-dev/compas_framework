[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# project info
# ============================================================================

[project]
name = "compas_framework"
description = "The COMPAS framework packages"
keywords = []
authors = [{ name = "tom van mele", email = "tom.v.mele@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "compas>=3.0.0",
    "compas_cgal",
    "compas_gmsh",
    "compas_libigl",
    "compas_model",
    "compas_occ",
    "compas_session",
    "compas_shapeop",
    "compas_viewer",
]

[project.urls]
Homepage = "https://compas-dev.github.io/compas_framework"
Documentation = "https://compas-dev.github.io/compas_framework"
Repository = "https://github.com/compas-dev/compas_framework"
Changelog = "https://github.com/compas-dev/compas_framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/compas-dev/compas_framework/issues"
Forum = "https://forum.compas-framework.org/"

# ============================================================================
# PEP 735 dependency groups
# ============================================================================

[dependency-groups]
dev = [
    "bump-my-version>=1.2,<2",
    "invoke>=2.2,<3",
    "pre-commit>=4,<5",
    "pyright==1.1.414",
    "ruff>=0.14,<1",
    { include-group = "tests" },
    { include-group = "docs" },
    { include-group = "build" },
]
tests = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]
docs = [
    "mike>=2,<3",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.30,<1",
    "pymdown-extensions>=11,<12",
]
build = [
    "build==1.3.0",
    "twine==6.2.0",
    "wheel>=0.45,<1",
    { include-group = "tests" },
]
candidate = [
    "jsonschema>=4.26,<5",
    "packaging>=26,<27",
    "pyright==1.1.414",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.uv.sources]
compas = { git = "https://github.com/compas-dev/compas.git", rev = "9b1518f74fe7d0315626954d8b893756f8dae06d" }
compas-occ = { git = "https://github.com/compas-dev/compas_occ.git", rev = "5a4cf9701007266e517996181c8476488c4030d9" }
compas-cgal = { git = "https://github.com/compas-dev/compas_cgal.git", rev = "a46eecab71de5dfea6df7380d2eafb7185cc789a" }
compas-libigl = { git = "https://github.com/compas-dev/compas_libigl.git", rev = "86e3f1e0e02d6dc7cf9ad8049ac57c4c7d801877" }

# ============================================================================
# setuptools config
# ============================================================================

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "compas_framework.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_framework"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-glob=*.md",
    "--tb=short",
    "--import-mode=importlib",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]
markers = [
    "integration: cross-package integration tests",
    "roundtrip: data serialization and conversion roundtrip tests",
    "performance: performance and regression benchmark tests",
    "gui: tests requiring GUI capabilities",
    "native_backend: tests requiring a native geometry backend",
]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "0.1.3"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_framework/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py312"
extend-exclude = [
    "tests/test_geometry_tessellation_integration.py",
    "tests/test_native_geometry_backends.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas_framework"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
exclude = ["docs/**/*.md", "initiatives/**/*.md"]

[tool.pyright]
include = [
    "src/compas_framework",
    "tasks.py",
    "tests/test_package.py",
    "tests/test_distribution_artifacts.py",
]
pythonVersion = "3.12"
